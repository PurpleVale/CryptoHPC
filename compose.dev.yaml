services:
  CryptoHPC:
    build:
      context: ./
      dockerfile: ./docker/Dockerfile
    image: cpp_develop
    security_opt:
      - seccomp:unconfined
    container_name: cpp-develop
    ports:
      - "2222:22"
      - "56420:56420"
    working_dir: /app
    hostname: cpp-develop
    volumes:
      - ${HOME}/.Xauthority:/root/.Xauthority:rw
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev/dri:/dev/dri:ro
    environment:
     - DISPLAY=${DISPLAY}
     - XAUTHORITY=${XAUTHORITY}
     - NVIDIA_VISIBLE_DEVICES=all
     - NVIDIA_DRIVER_CAPABILITIES=compute,utility
